<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Touchpad">
<title>Touchpad</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; color: #ccc;
      font-family: -apple-system, system-ui, sans-serif; overflow: hidden;
      overscroll-behavior: none; }
  body { display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #c33; }
  #dot.ok { background: #3c3; }
  #bar label { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #pad { flex: 1; margin: 0 10px; border-radius: 18px; background: #1d1d1f;
      touch-action: none; display: flex; align-items: center; justify-content: center;
      color: #444; font-size: 13px; text-align: center; line-height: 1.6; }
  #btns { display: flex; gap: 10px; padding: 10px; height: 90px; }
  #btns div { flex: 1; border-radius: 14px; background: #2a2a2d; touch-action: none;
      display: flex; align-items: center; justify-content: center; font-size: 15px; }
  #btns div.on { background: #4a4a50; }
  #btns #drag.on { background: #2d5aa0; }
</style>
</head>
<body>
<div id="bar">
  <div id="dot"></div><span id="st">Conectando…</span>
  <label>Vel <input id="sens" type="range" min="0.5" max="4" step="0.1"></label>
</div>
<div id="pad">1 dedo: mover · tap: click<br>2 dedos: scroll · tap 2 dedos: click derecho<br>
  3 dedos tap: click medio · doble tap y arrastrar: drag</div>
<div id="btns">
  <div data-b="l">Izq</div>
  <div id="drag">Mantener</div>
  <div data-b="r">Der</div>
</div>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const token = qs.get("t") || "";
  const dot = document.getElementById("dot"), st = document.getElementById("st");
  const sensEl = document.getElementById("sens");

  // ---- Ajustes ----
  let sens = 1.6;
  try { sens = parseFloat(localStorage.getItem("sens")) || sens; } catch (_) {}
  sensEl.value = sens;
  sensEl.oninput = () => { sens = parseFloat(sensEl.value);
    try { localStorage.setItem("sens", sens); } catch (_) {} };
  const ACCEL = 0.9;        // cuánto acelera con la velocidad del dedo
  const SCROLL = 4;         // px de dedo -> unidades hi-res (120 = 1 paso)
  const TAP_MS = 220, TAP_MOVE = 8, DRAG_WINDOW = 280;

  // ---- WebSocket ----
  let ws = null;
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
    ws.onopen = () => { dot.className = "ok"; st.textContent = "Conectado"; };
    ws.onclose = () => { dot.className = ""; st.textContent = "Reconectando…";
      setTimeout(connect, 700); };
    ws.onerror = () => ws.close();
  }
  connect();
  const send = (s) => { if (ws && ws.readyState === 1) ws.send(s); };

  // ---- Gestos en el pad ----
  const pad = document.getElementById("pad");
  const last = new Map();    // identifier -> {x, y}
  let g = null;              // gesto actual
  let lastTapEnd = -1e9;       // para doble-tap-drag
  let dragging = false;      // botón izq. apretado por gesto
  let lastMoveT = 0;

  function snapshot(touches) {
    last.clear();
    for (const t of touches) last.set(t.identifier, { x: t.clientX, y: t.clientY });
  }

  pad.addEventListener("touchstart", (ev) => {
    ev.preventDefault();
    const now = performance.now();
    if (!g) {
      g = { start: now, maxF: 0, moved: 0, mode: null,
            maybeDrag: now - lastTapEnd < DRAG_WINDOW };
      lastMoveT = now;
    }
    g.maxF = Math.max(g.maxF, ev.touches.length);
    snapshot(ev.touches);
  }, { passive: false });

  pad.addEventListener("touchmove", (ev) => {
    ev.preventDefault();
    if (!g) return;
    // Delta promedio de los dedos que ya conocíamos
    let dx = 0, dy = 0, n = 0;
    for (const t of ev.touches) {
      const p = last.get(t.identifier);
      if (p) { dx += t.clientX - p.x; dy += t.clientY - p.y; n++; }
    }
    snapshot(ev.touches);
    if (!n) return;
    dx /= n; dy /= n;
    g.moved += Math.hypot(dx, dy);

    const now = performance.now();
    const dt = Math.max(now - lastMoveT, 1);
    lastMoveT = now;

    if (ev.touches.length >= 2) {
      g.mode = "scroll";
      // Scroll "natural" (como en Mac / iPhone)
      send(`s,${(-dx * SCROLL).toFixed(1)},${(dy * SCROLL).toFixed(1)}`);
    } else if (g.mode !== "scroll" && g.maxF === 1) {
      if (g.maybeDrag && !dragging && g.moved > TAP_MOVE) {
        dragging = true; send("d,l");
      }
      const v = Math.hypot(dx, dy) / dt;              // px/ms
      const gain = sens * (1 + ACCEL * Math.min(v, 4));
      send(`m,${(dx * gain).toFixed(2)},${(dy * gain).toFixed(2)}`);
    }
  }, { passive: false });

  function end(ev) {
    ev.preventDefault();
    snapshot(ev.touches);
    if (!g || ev.touches.length) return;
    const now = performance.now();
    const isTap = now - g.start < TAP_MS * (g.maxF > 1 ? 1.5 : 1) && g.moved < TAP_MOVE * g.maxF;
    if (dragging) { dragging = false; send("u,l"); }
    else if (isTap) {
      send("c," + ({ 1: "l", 2: "r" }[g.maxF] || "m"));
      if (g.maxF === 1) lastTapEnd = now;
    }
    g = null;
  }
  pad.addEventListener("touchend", end, { passive: false });
  pad.addEventListener("touchcancel", end, { passive: false });

  // ---- Botones físicos ----
  for (const el of document.querySelectorAll("#btns [data-b]")) {
    const b = el.dataset.b;
    el.addEventListener("touchstart", (e) => { e.preventDefault(); el.classList.add("on"); send("d," + b); });
    const up = (e) => { e.preventDefault(); el.classList.remove("on"); send("u," + b); };
    el.addEventListener("touchend", up); el.addEventListener("touchcancel", up);
  }
  // "Mantener": alterna el botón izquierdo apretado (para arrastrar largas distancias)
  const dragBtn = document.getElementById("drag");
  let locked = false;
  dragBtn.addEventListener("touchstart", (e) => {
    e.preventDefault(); locked = !locked;
    dragBtn.classList.toggle("on", locked); send(locked ? "d,l" : "u,l");
  });

  // Evitar zoom con pellizco / doble tap en Safari
  document.addEventListener("gesturestart", (e) => e.preventDefault());
})();
</script>
</body>
</html>
